# ench-notes API + MCP server (systemd unit ench-api, Node on 127.0.0.1:8787).
# TLS lines are added by `certbot --nginx -d ench-api.duckdns.org`.
server {
    server_name ench-api.duckdns.org;

    # Scraped locally only; never expose Prometheus metrics publicly.
    location /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # MCP streamable HTTP uses SSE-style responses; do not buffer them.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2m;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ench-api.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ench-api.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ench-api.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name ench-api.duckdns.org;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}